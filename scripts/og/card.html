<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      :root {
        --bg: oklch(0.195 0.006 255);
        --fg: oklch(0.955 0.004 255);
        --muted: oklch(0.75 0.012 255);
        --rule: oklch(0.98 0 0 / 0.18);
        --rule-strong: oklch(0.98 0 0 / 0.32);
        --ver-blue: oklch(0.55 0.145 260);
        --ver-yellow: oklch(0.88 0.16 92);
        --ver-red: oklch(0.6 0.21 27);
        --s-green: oklch(0.8 0.19 145);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px 0;
        font-family: "Archivo", sans-serif;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0.03em;
        color: var(--muted);
      }
      .top .badge {
        padding: 6px 10px;
        border: 1px solid var(--rule-strong);
        color: var(--fg);
        font-size: 20px;
      }
      .top .dot {
        width: 12px;
        height: 12px;
        background: var(--s-green);
      }
      h1 {
        font-size: 128px;
        line-height: 0.96;
        font-weight: 640;
        font-stretch: 125%;
        letter-spacing: -0.028em;
      }
      h1 span {
        display: block;
      }
      .role {
        margin-top: 36px;
        display: flex;
        gap: 28px;
        align-items: baseline;
        font-family: "JetBrains Mono", monospace;
        font-size: 30px;
        font-weight: 500;
      }
      .role .stack {
        color: var(--muted);
        font-weight: 400;
      }
      .ruler {
        position: relative;
        height: 36px;
        margin: 0 -80px;
        border-bottom: 1px solid var(--rule);
        background:
          repeating-linear-gradient(90deg, var(--rule-strong) 0 2px, transparent 2px 120px) left bottom / 100% 26px no-repeat,
          repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 12px) left bottom / 100% 12px no-repeat;
      }
      .ruler .mark {
        position: absolute;
        left: 0;
        bottom: -1px;
        width: 34%;
        height: 6px;
        background: linear-gradient(90deg, var(--ver-blue) 0 82%, var(--ver-yellow) 82% 93%, var(--ver-red) 93% 100%);
      }
    </style>
  </head>
  <body>
    <div class="top"><span class="badge">AYR</span><span class="dot"></span><span>Maceió, BR</span></div>
    <div>
      <h1><span>Ayrames</span><span>Teodósio</span></h1>
      <p class="role"><span>Full Stack</span><span class="stack">React · TypeScript · Next.js</span></p>
    </div>
    <div class="ruler"><span class="mark"></span></div>
  </body>
</html>
